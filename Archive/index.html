<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>어둠의 청강단 기획 허브</title>
  <meta name="description" content="Notion export를 정리한 어둠의 청강단 기획 문서 허브">
  <link rel="icon" href="data:,">
  <script defer src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script type="module">
    import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs";
    window.mermaid = mermaid;
    window.dispatchEvent(new Event("archive-mermaid-ready"));
  </script>
  <link rel="stylesheet" href="../assets/css/notion-hub.css?v=20260615-shim-parity123">
  <script src="../assets/data/notion-archive-data.js?v=20260615"></script>
  <script defer src="../assets/js/notion-hub.js?v=20260615-shim-parity123"></script>
</head>
<body>
  <div id="app" class="archive-app">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">AC</div>
        <div class="brand-copy">
          <strong id="appTitle">어둠의 청강단 기획 허브</strong>
          <span id="appSubtitle">Notion export 정리본</span>
          <small id="saveStatus" class="save-status">초기화 중</small>
        </div>
      </div>
      <nav class="view-tabs" aria-label="주요 보기">
        <button class="view-tab" type="button" data-view="overview">대시보드</button>
        <button class="view-tab" type="button" data-view="documents">문서</button>
        <button class="view-tab" type="button" data-view="wiki">위키</button>
        <button class="view-tab" type="button" data-view="collections">표 데이터</button>
        <button class="view-tab" type="button" data-view="media">미디어</button>
        <button class="view-tab" type="button" data-view="cleanup">정리 보드</button>
      </nav>
      <div class="edit-actions" aria-label="편집 도구">
        <span id="modeBadge" class="mode-badge">보기 모드</span>
        <button id="editToggle" class="mode-switch" type="button" aria-pressed="false">보기</button>
        <div class="command-controls" aria-label="작업 되돌리기와 다시 실행">
          <button id="undoCommand" class="icon command-button" type="button" title="되돌리기 (Ctrl+Z)" disabled>↶</button>
          <button id="redoCommand" class="icon command-button" type="button" title="다시 실행 (Ctrl+Y)" disabled>↷</button>
        </div>
        <button id="openTerms" type="button">용어 검색</button>
        <button id="openHistory" type="button">버전 기록</button>
        <button id="saveArchive" class="primary-action" type="button">파일 저장</button>
        <button id="exportArchive" type="button">JSON 내보내기</button>
        <button id="exportHtml" type="button">HTML 내보내기</button>
        <button id="exportReportHtml" type="button">HTML 보고서</button>
        <button id="exportMarkdown" type="button" title="마크다운으로 출력하기">MD 출력</button>
        <button id="exportWorkbook" type="button" title="모든 표 데이터를 Excel 워크북으로 저장">Excel 저장</button>
        <label class="file-action">가져오기<input id="importArchive" type="file" accept=".json,.html,application/json,text/html"></label>
        <span id="collabStatus" class="collab-status offline">협업 연결 중</span>
        <span id="authUser" class="auth-user hidden"></span>
        <button id="logoutButton" class="auth-logout hidden" type="button">로그아웃</button>
      </div>
      <div class="search-wrap">
        <label class="visually-hidden" for="globalSearch">문서 검색</label>
        <input id="globalSearch" class="global-search" type="search" placeholder="문서, 시스템, 캐릭터, UI 검색">
      </div>
    </header>

    <div class="layout">
      <aside class="sidebar" id="sidebar" aria-label="문서 탐색"></aside>
      <main class="workspace" id="workspace" tabindex="-1"></main>
    </div>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <div id="floatingToolbar" class="floating-toolbar" aria-label="서식 도구">
    <button id="formatBold" type="button" data-floating-format="bold" title="굵게"><b>B</b></button>
    <button id="formatItalic" type="button" data-floating-format="italic" title="기울임"><i>I</i></button>
    <button id="formatUnderline" type="button" data-floating-format="underline" title="밑줄"><u>U</u></button>
    <button type="button" data-floating-format="strike" title="취소선"><s>S</s></button>
    <button type="button" data-floating-format="code" title="인라인 코드">{ }</button>
    <button id="formatLink" type="button" data-floating-format="link" title="링크">Link</button>
    <button type="button" data-floating-format="formula" title="수식">fx</button>
    <button type="button" data-floating-format="image" title="이미지 삽입">IMG</button>
    <button type="button" data-floating-format="bullet" title="글머리">•</button>
    <button type="button" data-floating-format="ordered" title="번호 목록">1.</button>
    <button type="button" data-floating-format="check" title="체크 항목">☑</button>
    <button type="button" data-floating-format="clear" title="서식 지우기">Tx</button>
  </div>
  <div id="slashPalette" class="slash-palette hidden" aria-label="블록 삽입 메뉴"></div>
  <input id="mediaFilePicker" type="file" accept="image/*,video/*,.gif,.txt,.md,.json,.csv,.tsv,.pdf,.doc,.docx,.xls,.xlsx,.ppt,.pptx,.zip">
  <input id="tableFilePicker" type="file" accept=".xlsx,.xls,.csv,.tsv,text/csv,text/tab-separated-values">
  <aside id="termPanel" class="term-panel hidden" aria-live="polite">
    <div class="panel-head">
      <h2>용어 사전</h2>
      <button id="closeTerms" class="icon" type="button" title="닫기">×</button>
    </div>
    <div class="term-search-wrap">
      <input id="termSearch" class="term-search" type="search" placeholder="용어 검색">
    </div>
    <div class="term-editor">
      <input id="termKeyword" class="term-search" type="text" placeholder="새 용어">
      <input id="termAliases" class="term-search" type="text" placeholder="별칭, 쉼표로 구분">
      <textarea id="termDescription" class="term-search" rows="3" placeholder="설명"></textarea>
      <button id="saveTerm" class="primary-action" type="button">용어 저장</button>
    </div>
    <div id="termResults" class="term-results"></div>
  </aside>
  <aside id="versionPanel" class="version-panel hidden" aria-live="polite">
    <div class="panel-head">
      <h2>버전 기록</h2>
      <button id="closeHistory" class="icon" type="button" title="닫기">×</button>
    </div>
    <div class="version-actions">
      <button id="saveVersion" class="primary-action" type="button">현재 버전 저장</button>
      <button id="refreshVersionDiff" type="button">diff 새로고침</button>
    </div>
    <div class="version-compare">
      <label class="editor-field">기준 버전
        <select id="versionBaseSelect"></select>
      </label>
      <label class="editor-field">비교 대상
        <select id="versionTargetSelect"></select>
      </label>
    </div>
    <div id="versionSummary" class="version-summary"></div>
    <div id="versionDiff" class="version-diff"></div>
    <div id="versionList" class="version-list"></div>
  </aside>
</body>
</html>
