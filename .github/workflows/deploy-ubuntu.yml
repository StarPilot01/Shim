name: Deploy to Ubuntu

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ubuntu-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: [self-hosted, linux, shim-ubuntu]
    env:
      APP_DIR: ${{ secrets.UBUNTU_APP_DIR }}
      SERVICE_NAME: ${{ secrets.UBUNTU_SERVICE_NAME || 'ShimRoom' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate secrets
        run: |
          test -n "$APP_DIR" || (echo "Missing UBUNTU_APP_DIR" && exit 1)

      - name: Deploy files
        run: |
          mkdir -p "$APP_DIR"
          rm -rf \
            "$APP_DIR/Archive" \
            "$APP_DIR/assets/notion-media"
          rm -f \
            "$APP_DIR/assets/data/notion-archive-data.js" \
            "$APP_DIR/assets/js/notion-hub.js" \
            "$APP_DIR/assets/css/notion-hub.css"
          tar \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='.collab' \
            --exclude='Archive' \
            --exclude='assets/notion-media' \
            --exclude='assets/data/notion-archive-data.js' \
            --exclude='assets/js/notion-hub.js' \
            --exclude='assets/css/notion-hub.css' \
            --exclude='test-results' \
            --exclude='shimroom_test_runner.html' \
            -czf /tmp/ShimRoom-deploy-${GITHUB_SHA}.tgz .
          tar -xzf /tmp/ShimRoom-deploy-${GITHUB_SHA}.tgz -C "$APP_DIR"
          rm -f /tmp/ShimRoom-deploy-${GITHUB_SHA}.tgz

      - name: Install dependencies and restart
        run: |
          set -euo pipefail
          cd "$APP_DIR"
          npm ci --omit=dev
          sudo -n systemctl restart "$SERVICE_NAME"
          systemctl --no-pager --lines=30 status "$SERVICE_NAME"
