name: Set ShimRoom Admin User

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  set-admin-user:
    runs-on: [self-hosted, linux, shim-ubuntu]
    env:
      APP_DIR: ${{ secrets.UBUNTU_APP_DIR }}
      SERVICE_NAME: ${{ secrets.UBUNTU_SERVICE_NAME || 'ShimRoom' }}
      SHIM_PASSWORD: ${{ secrets.SHIMROOM_ADMIN_PASSWORD }}

    steps:
      - name: Validate inputs
        run: |
          test -n "$APP_DIR" || (echo "Missing UBUNTU_APP_DIR" && exit 1)
          test -n "$SHIM_PASSWORD" || (echo "Missing SHIMROOM_ADMIN_PASSWORD" && exit 1)

      - name: Upsert admin user
        run: |
          set -euo pipefail
          cd "$APP_DIR"

          service_env="$(systemctl show "$SERVICE_NAME" --property=Environment --value)"
          for item in $service_env; do
            case "$item" in
              DATABASE_URL=*|MYSQL_HOST=*|MYSQL_PORT=*|MYSQL_USER=*|MYSQL_PASSWORD=*|MYSQL_DATABASE=*)
                export "$item"
                ;;
            esac
          done

          node --input-type=module <<'NODE'
          import { randomBytes, scryptSync } from "node:crypto";
          import { createMysqlPoolFromEnv, ensureAuthSchema } from "./server/mysql-auth.mjs";

          const PASSWORD_ALGO = "scrypt";
          const PASSWORD_PARAMS = {
            N: 32768,
            r: 8,
            p: 1,
            keylen: 64,
            maxmem: 64 * 1024 * 1024
          };

          const password = String(process.env.SHIM_PASSWORD || "");
          if (!password) throw new Error("Missing admin password.");

          const salt = randomBytes(16).toString("base64url");
          const hash = scryptSync(password, salt, PASSWORD_PARAMS.keylen, PASSWORD_PARAMS).toString("base64url");
          const passwordHash = [
            PASSWORD_ALGO,
            PASSWORD_PARAMS.N,
            PASSWORD_PARAMS.r,
            PASSWORD_PARAMS.p,
            salt,
            hash
          ].join("$");

          const pool = createMysqlPoolFromEnv(process.env);
          try {
            await ensureAuthSchema(pool);
            await pool.execute(
              `
                INSERT INTO users (username, display_name, password_hash, role)
                VALUES (?, ?, ?, ?)
                ON DUPLICATE KEY UPDATE
                  display_name = VALUES(display_name),
                  password_hash = VALUES(password_hash),
                  role = VALUES(role),
                  disabled_at = NULL
              `,
              ["admin", "admin", passwordHash, "admin"]
            );
            console.log("User ready: admin (admin)");
          } finally {
            await pool.end();
          }
          NODE
